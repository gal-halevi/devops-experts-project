apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flask-counter.fullname" . }}
  labels:
    {{ include "flask-counter.labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
      {{ include "flask-counter.labels" . | indent 6 }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        {{ include "flask-counter.labels" . | indent 8 }}
    spec:
      containers:
        - name: {{ include "flask-counter.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
          envFrom:
            - configMapRef:
                name: {{ include "flask-counter.fullname" . }}-config
            - secretRef:
                name: {{ include "flask-counter.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 200m

