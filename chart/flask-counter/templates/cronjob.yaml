{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "flask-counter.fullname" . }}-cron
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: auto-inc
              image: curlimages/curl:8.17.0
              command: ["sh", "-c"]
              args: ["curl -X POST http://{{ include "flask-counter.fullname" . }}/inc"]
          restartPolicy: OnFailure
{{- end }}